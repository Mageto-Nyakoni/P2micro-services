spring:
  application:
    name: appointment-service

datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: auth_user
    password: auth_password

jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8083

eureka:

 client:
    enable: true
    service-url:
      default-zone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    instance:
       prefer-ip-address: true

     