spring:
  application:
    name: AppointmentService
  datasource:
    url: jdbc:postgresql://localhost:5435/appointment_db
    username: appointment_user
    password: appointment_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8083

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost


     