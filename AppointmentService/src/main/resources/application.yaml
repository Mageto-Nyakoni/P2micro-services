spring:
  application:
    name: AppointmentService

datasource:
    url: jdbc:postgresql://localhost:5435/appointment_db
    username: appointment_user
    password: appointment_password

jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8083

eureka:

 client:
    enable: true
    service-url:
      default-zone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    instance:
      prefer-ip-address: true

     