
server:
  port: 8083


spring:
  application:
    name: AppointmentService

datasource:
    url: jdbc:postgresql://localhost:5432/appointment_db
    username: postgres
    password: password

jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true