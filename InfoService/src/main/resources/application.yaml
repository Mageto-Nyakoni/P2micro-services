spring:
  application:
    name: InfoService
  datasource:
    url: jdbc:postgresql://localhost:5434/info_db
    username: info_user
    password: info_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8082

eureka:
# instance:
#   hostname: localhost
  client:
    enable: true
    service-url:
      default-zone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    instance:
      prefer-ip-address: true