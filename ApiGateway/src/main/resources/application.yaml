server:
  port: 8080

spring:
  application:
    name: ApiGateway
  cloud:
    gateway:
      routes:
        - id: AuthService
          uri: lb://AuthService
          predicates:
            - Path=/smart-appointment/api/auth/**

        - id: AppointmentService
          uri: lb://AppointmentService
          predicates:
            - Path=/smart-appointment/api/appointments/**

        - id: InfoService
          uri: lb://InfoService
          predicates:
            - Path=/smart-appointment/api/info/**

        - id: ScheduleService
          uri: lb://SCHEDULESERVICE
          predicates:
            - Path=/smart-appointment/api/schedule/**
        
eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

