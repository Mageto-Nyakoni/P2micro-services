spring:
  application:
    name: api-gateway

# datasource:
 #   url: jdbc:postgresql://localhost:5433/auth_db
   # username: auth_user
   # password: auth_password

#jpa:
   # hibernate:
    #  ddl-auto: update
   # show-sql: true

server:
  port: 8080

eureka:
# instance:
#   hostname: localhost
  client:
    enable: true
    service-url:
      default-zone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    instance:
      prefer-ip-address: true

spring:
  cloud:
    gateway:
      routes:
        - id: appointment-service
          uri: lb://APPOINTMENT-SERVICE   # Must match AppointmentService's spring.application.name
          predicates:
            - Path=/api/appointments/**

